<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Studio photo Sérénid</title>
<!-- Outil interne : génère les photos produit (rendu 3D) utilisées par le site. Voir tools/render.mjs -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>html,body{margin:0;background:#F7F5F1}canvas{display:block}</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
const T = THREE;
const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot') || 'nid';
const W = +Q.get('w') || 1200, H = +Q.get('h') || 1200, SS = +Q.get('ss') || 2;
const C = { encre: 0x1F3A4D, bleu: 0x4F7A96, brume: 0xC9DBE6, abricot: 0xE8A07A, coquille: 0xF7F5F1 };
const lin = (h) => new T.Color(h).convertSRGBToLinear();

await document.fonts.load('420 80px Fraunces');
await document.fonts.load('600 40px "Hanken Grotesk"');

const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(SS);
renderer.setSize(W, H);
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();

/* ---------- Éclairage studio : environnement « softbox » + lumière clé ---------- */
function studioEnv(tint = C.coquille) {
  const s = new T.Scene();
  s.add(new T.Mesh(new T.BoxGeometry(200, 120, 200), new T.MeshBasicMaterial({ color: lin(tint).multiplyScalar(0.35), side: T.BackSide })));
  const panel = (w, h, pos, rot, k) => {
    const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(1, 1, 1).multiplyScalar(k), side: T.DoubleSide }));
    m.position.set(...pos); m.rotation.set(...rot); s.add(m);
  };
  panel(90, 50, [0, 59, 0], [Math.PI / 2, 0, 0], 2.4);
  panel(50, 70, [-99, 10, 20], [0, Math.PI / 2, 0], 1.8);
  panel(40, 50, [99, 5, -30], [0, -Math.PI / 2, 0], 0.7);
  panel(80, 30, [0, 10, 99], [0, Math.PI, 0], 0.5);
  const pm = new T.PMREMGenerator(renderer);
  return pm.fromScene(s, 0.035).texture;
}
scene.environment = studioEnv();
scene.add(new T.HemisphereLight(lin(C.coquille), lin(C.brume), 0.12));
const key = new T.DirectionalLight(lin(C.coquille), 2.6);
key.position.set(-40, 70, 45);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 300 });
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.04;
scene.add(key);
const fill = new T.DirectionalLight(lin(C.brume), 0.3); fill.position.set(50, 20, 30); scene.add(fill);
const rim = new T.DirectionalLight(lin(C.coquille), 0.55); rim.position.set(10, 30, -60); scene.add(rim);

/* ---------- Matières ---------- */
const M = {
  shell: (c = C.coquille) => new T.MeshPhysicalMaterial({ color: lin(c), roughness: 0.36, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.35 }),
  matte: (c, r = 0.75) => new T.MeshStandardMaterial({ color: lin(c), roughness: r, metalness: 0 }),
  metal: (c = C.brume, r = 0.22) => new T.MeshStandardMaterial({ color: lin(c), roughness: r, metalness: 1 }),
  led: () => new T.MeshStandardMaterial({ color: lin(C.abricot), emissive: lin(C.abricot), emissiveIntensity: 1.6, roughness: 0.3 }),
};
function radialTex(stops, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => grd.addColorStop(o, col));
  g.fillStyle = grd; g.fillRect(0, 0, size, size);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return t;
}
const CONTACT = radialTex([[0, 'rgba(31,58,77,0.55)'], [0.45, 'rgba(31,58,77,0.2)'], [1, 'rgba(31,58,77,0)']]);
function contact(parent, w, d, y = 0.02, k = 1) {
  const m = new T.Mesh(new T.PlaneGeometry(w, d), new T.MeshBasicMaterial({ map: CONTACT, transparent: true, depthWrite: false, opacity: k }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.renderOrder = 1; parent.add(m); return m;
}
const shadowAll = (o) => o.traverse((m) => { if (m.isMesh && !m.material.transparent) { m.castShadow = true; m.receiveShadow = true; } });

/* ---------- Fond photo (cyclorama) ---------- */
const PAPER = 0xDDE6EB;
function cyclo(color = PAPER) {
  const prof = [];
  for (let z = 160; z > -30; z -= 10) prof.push([z, 0]);
  for (let i = 0; i <= 32; i++) { const a = (i / 32) * Math.PI / 2; prof.push([-30 - Math.sin(a) * 40, 40 - Math.cos(a) * 40]); }
  for (let y = 60; y <= 300; y += 40) prof.push([-70, y]);
  const pos = [], idx = [];
  prof.forEach(([z, y]) => { pos.push(-300, y, z, 300, y, z); });
  for (let i = 0; i < prof.length - 1; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new T.Mesh(g, new T.MeshStandardMaterial({ color: lin(color), roughness: 0.95, side: T.DoubleSide }));
  m.receiveShadow = true; scene.add(m); return m;
}

/* ---------- Le Nid (96 × 96 × 44 mm) ---------- */
function nid({ finish = C.coquille, led = true } = {}) {
  const g = new T.Group();
  const R = 4.8, HT = 3.15, HB = 1.05;
  const prof = (a) => { const c = Math.cos(a), s = Math.sin(a), top = s >= 0; const e = 2 / (top ? 2.35 : 4.6); return [R * Math.pow(Math.max(c, 0), e), (top ? HT : HB) * Math.sign(s) * Math.pow(Math.abs(s), e)]; };
  const pts = []; for (let i = 0; i <= 120; i++) { const [x, y] = prof(-Math.PI / 2 + Math.PI * i / 120); pts.push(new T.Vector2(Math.max(x, 0.001), y + HB)); }
  g.add(new T.Mesh(new T.LatheGeometry(pts, 200), M.shell(finish)));
  const seam = new T.Mesh(new T.TorusGeometry(R + 0.01, 0.035, 12, 240), M.matte(C.brume, 0.5)); seam.rotation.x = Math.PI / 2; seam.position.y = HB - 0.15; g.add(seam);
  const foot = new T.Mesh(new T.CylinderGeometry(R * 0.72, R * 0.72, 0.16, 96), M.matte(C.encre, 0.9)); foot.position.y = 0.06; g.add(foot);
  // voyant
  const aL = 0.42; const [lx, ly] = prof(aL), [lx2, ly2] = prof(aL + 0.01);
  const tl = Math.hypot(lx2 - lx, ly2 - ly); const n = new T.Vector3(0, -(lx2 - lx) / tl, (ly2 - ly) / tl).normalize();
  const p = new T.Vector3(0, ly + HB, lx);
  const lens = new T.Mesh(new T.TorusGeometry(0.42, 0.03, 12, 96), M.matte(C.brume, 0.4)); lens.position.copy(p).addScaledVector(n, 0.005); lens.lookAt(lens.position.clone().add(n)); g.add(lens);
  const ledM = new T.Mesh(new T.CircleGeometry(0.24, 64), led ? M.led() : M.matte(C.abricot, 0.4)); ledM.position.copy(p).addScaledVector(n, 0.012); ledM.lookAt(ledM.position.clone().add(n)); g.add(ledM);
  if (led) {
    const glow = new T.Mesh(new T.PlaneGeometry(3.4, 3.4), new T.MeshBasicMaterial({ map: radialTex([[0, 'rgba(232,160,122,0.55)'], [0.25, 'rgba(232,160,122,0.22)'], [1, 'rgba(232,160,122,0)']]), transparent: true, depthWrite: false, toneMapped: false }));
    glow.position.copy(p).addScaledVector(n, 0.03); glow.lookAt(glow.position.clone().add(n)); g.add(glow);
    const pl = new T.PointLight(lin(C.abricot), 0.5, 7, 2); pl.position.copy(p).addScaledVector(n, 0.8); g.add(pl);
  }
  // port USB-C à l’arrière
  const port = new T.Mesh(capsuleGeo(0.9, 0.3, 0.3), M.matte(C.encre, 0.5)); port.position.set(0, HB * 0.55, -R + 0.08); g.add(port);
  shadowAll(g); contact(g, 13, 13, 0.03, 0.9);
  return g;
}
function capsuleGeo(w, h, d) {
  const s = new T.Shape(); const r = h / 2;
  s.absarc(-w / 2 + r, 0, r, Math.PI / 2, Math.PI * 1.5, false); s.absarc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2, false);
  const g = new T.ExtrudeGeometry(s, { depth: d, bevelEnabled: false, curveSegments: 24 }); g.translate(0, 0, -d / 2); return g;
}
function roundRect(w, h, r) {
  const s = new T.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function roundedBox(w, h, d, r, mat) {
  const g = new T.ExtrudeGeometry(roundRect(w - 2 * r, h - 2 * r, Math.min(r, 0.001) + 0.0001), { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 6, curveSegments: 6 });
  g.translate(0, 0, -(d - 2 * r) / 2);
  return new T.Mesh(g, mat);
}

/* ---------- Pastille (58 × 34 × 14 mm) ---------- */
const LOCK = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.strokeStyle = '#4F7A96'; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(92, 120); g.lineTo(92, 92); g.arc(128, 92, 36, Math.PI, 0); g.lineTo(164, 120); g.stroke();
  g.beginPath(); g.roundRect ? g.roundRect(70, 118, 116, 82, 18) : g.rect(70, 118, 116, 82); g.stroke();
  g.beginPath(); g.moveTo(128, 148); g.lineTo(128, 170); g.stroke();
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 8; return t;
})();
function pastille({ finish = C.coquille } = {}) {
  const g = new T.Group();
  const geo = new T.ExtrudeGeometry(roundRect(5.3, 2.9, 1.1), { depth: 0.85, bevelEnabled: true, bevelThickness: 0.28, bevelSize: 0.25, bevelSegments: 10, curveSegments: 40 });
  const body = new T.Mesh(geo, M.shell(finish)); body.rotation.x = -Math.PI / 2; body.position.y = 0.28; g.add(body);
  const btn = new T.Mesh(new T.CylinderGeometry(0.82, 0.82, 0.06, 96), M.shell(finish === C.coquille ? 0xEFF1F0 : finish)); btn.position.y = 1.41; g.add(btn);
  const ring = new T.Mesh(new T.TorusGeometry(0.84, 0.035, 10, 96), M.matte(C.brume, 0.45)); ring.rotation.x = Math.PI / 2; ring.position.y = 1.42; g.add(ring);
  const ic = new T.Mesh(new T.PlaneGeometry(1.15, 1.15), new T.MeshBasicMaterial({ map: LOCK, transparent: true, depthWrite: false, opacity: 0.9 })); ic.rotation.x = -Math.PI / 2; ic.position.y = 1.445; g.add(ic);
  const dot = new T.Mesh(new T.CylinderGeometry(0.09, 0.09, 0.04, 32), M.led()); dot.position.set(2.0, 1.4, -0.85); g.add(dot);
  shadowAll(g); contact(g, 8.5, 5.5, 0.03, 0.85);
  return g;
}

/* ---------- Clé Sérénid (42 × 30 × 9 mm) ---------- */
function cle({ finish = C.coquille } = {}) {
  const g = new T.Group();
  const s = new T.Shape();
  s.moveTo(0, -1.6); s.bezierCurveTo(1.05, -1.6, 1.6, -0.95, 1.6, 0); s.bezierCurveTo(1.6, 1.0, 0.95, 1.55, 0.6, 2.15);
  s.bezierCurveTo(0.38, 2.55, -0.38, 2.55, -0.6, 2.15); s.bezierCurveTo(-0.95, 1.55, -1.6, 1.0, -1.6, 0); s.bezierCurveTo(-1.6, -0.95, -1.05, -1.6, 0, -1.6);
  const hole = new T.Path(); hole.absarc(0, 2.02, 0.27, 0, Math.PI * 2, true); s.holes.push(hole);
  const geo = new T.ExtrudeGeometry(s, { depth: 0.45, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.18, bevelSegments: 10, curveSegments: 48 });
  const dark = finish === C.encre;
  const body = new T.Mesh(geo, dark ? new T.MeshPhysicalMaterial({ color: lin(C.encre), roughness: 0.42, clearcoat: 0.4, clearcoatRoughness: 0.3 }) : M.shell(finish));
  body.rotation.x = -Math.PI / 2; body.position.y = 0.2; g.add(body);
  const markM = M.matte(dark ? C.brume : C.bleu, 0.5);
  [[-1, 1], [1, -1]].forEach(([sx, rz]) => { const b = new T.Mesh(new T.BoxGeometry(0.85, 0.06, 0.13), markM); b.position.set(sx * 0.32, 0.88, 0.2); b.rotation.y = rz * 0.68; g.add(b); });
  const dot = new T.Mesh(new T.CylinderGeometry(0.15, 0.15, 0.05, 48), M.matte(C.abricot, 0.4)); dot.position.set(0, 0.88, -0.25); g.add(dot);
  const ringM = M.metal(0xD9E1E6, 0.18);
  const ring = new T.Mesh(new T.TorusGeometry(1.25, 0.075, 16, 120), ringM); ring.position.set(0, 0.32, -3.15); ring.rotation.x = -Math.PI / 2 + 0.12; g.add(ring);
  shadowAll(g); contact(g, 6, 8, 0.03, 0.7).position.z = -0.8;
  return g;
}

/* ---------- Téléphone avec l’application ---------- */
async function loadTex(src) { return new Promise((res) => new T.TextureLoader().load(src, (t) => { t.encoding = T.sRGBEncoding; t.anisotropy = 8; res(t); })); }
async function phone() {
  const g = new T.Group();
  const body = new T.Mesh(new T.ExtrudeGeometry(roundRect(7.1, 14.7, 1.1), { depth: 0.6, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.1, bevelSegments: 6, curveSegments: 32 }), new T.MeshPhysicalMaterial({ color: lin(C.encre), roughness: 0.35, clearcoat: 0.6 }));
  body.rotation.x = -Math.PI / 2; body.position.y = 0.12; g.add(body);
  const tex = await loadTex('app-screen.png');
  const screen = new T.Mesh(new T.ShapeGeometry(roundRect(6.6, 14.2, 0.9), 24), new T.MeshBasicMaterial({ map: tex, toneMapped: false }));
  const uv = screen.geometry.attributes.uv; const pos = screen.geometry.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / 6.6 + 0.5, pos.getY(i) / 14.2 + 0.5);
  screen.rotation.x = -Math.PI / 2; screen.position.y = 0.86; g.add(screen);
  const gloss = new T.Mesh(new T.ShapeGeometry(roundRect(6.6, 14.2, 0.9), 24), new T.MeshPhysicalMaterial({ color: 0x000000, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.12, clearcoat: 1 }));
  gloss.rotation.x = -Math.PI / 2; gloss.position.y = 0.87; g.add(gloss);
  shadowAll(g); contact(g, 11, 19, 0.03, 0.8);
  return g;
}

/* ---------- Coffret ---------- */
async function boxFront(name, contents) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1500; const g = c.getContext('2d');
  g.fillStyle = '#1F3A4D'; g.fillRect(0, 0, 1200, 1500);
  const logo = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = '../assets/logo/serenid-logo-inverse.svg'; });
  g.drawImage(logo, 110, 120, 420, 112);
  g.fillStyle = '#E8A07A'; g.beginPath(); g.arc(1040, 176, 18, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#F7F5F1'; g.font = '420 150px Fraunces'; g.fillText(name.split(' ')[0], 104, 860); g.fillText(name.split(' ').slice(1).join(' '), 104, 1010);
  g.fillStyle = '#C9DBE6'; g.font = '600 46px "Hanken Grotesk"'; g.fillText(contents, 110, 1110);
  g.strokeStyle = 'rgba(201,219,230,0.35)'; g.lineWidth = 3; g.beginPath(); g.moveTo(110, 1250); g.lineTo(1090, 1250); g.stroke();
  g.fillStyle = '#C9DBE6'; g.font = '400 42px Fraunces'; g.fillText('Protéger sans enfermer.', 110, 1350);
  // arcs radar discrets
  g.strokeStyle = 'rgba(201,219,230,0.18)'; g.lineWidth = 3;
  for (let i = 1; i <= 5; i++) { g.beginPath(); g.arc(900, 560, i * 70, Math.PI * 0.9, Math.PI * 2.1); g.stroke(); }
  g.fillStyle = '#E8A07A'; g.beginPath(); g.arc(900, 560, 16, 0, Math.PI * 2); g.fill();
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 8; return t;
}
async function coffret(name, contents, w = 22, h = 27.5, d = 7) {
  const tex = await boxFront(name, contents);
  const side = M.matte(C.encre, 0.62);
  const front = new T.MeshStandardMaterial({ map: tex, roughness: 0.58 });
  const box = new T.Mesh(new T.BoxGeometry(w, h, d), [side, side, side, side, front, side]);
  box.position.y = h / 2; box.castShadow = true; box.receiveShadow = true;
  const g = new T.Group(); g.add(box); contact(g, w * 1.3, d * 2.2, 0.03, 0.8);
  return g;
}

/* ---------- Petits objets de décor ---------- */
function bloc(color, size = 4) { const m = roundedBox(size, size, size, 0.45, M.matte(color, 0.6)); m.castShadow = m.receiveShadow = true; return m; }

/* ---------- Mise en scène ---------- */
const cam = new T.PerspectiveCamera(26, W / H, 0.5, 2000);
const place = (o, x, y, z, ry = 0) => { o.position.set(x, y, z); o.rotation.y = ry; scene.add(o); return o; };
const look = (p, t, fov) => { cam.position.set(...p); cam.lookAt(new T.Vector3(...t)); if (fov) { cam.fov = fov; cam.updateProjectionMatrix(); } };
const finishFromQ = () => (Q.get('finish') === 'brume' ? C.brume : C.coquille);

async function kitShot(name, contents, k) {
  cyclo();
  const f = finishFromQ();
  place(await coffret(name, contents), -7, 0, -13, 0.28);
  const nids = k.nids === 2 ? [[1, 0, -0.1], [11.5, -4, 0.35]] : [[5, -1, 0.15]];
  nids.forEach(([x, z, r]) => place(nid(), x, 0, z, r));
  const n = k.pastilles, cols = n > 10 ? 6 : n > 4 ? 5 : 4;
  for (let i = 0; i < n; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    place(pastille({ finish: f }), -15 + col * 6.4 + (row % 2) * 1.6, 0, 9 + row * 4.6, -0.1 + ((i * 7) % 5) * 0.04);
  }
  for (let i = 0; i < k.cles; i++) place(cle(), 17 + i * 3.6, 0, 5 + i * 3.6, -0.6 + i * 0.4);
  const rows = Math.ceil(n / cols);
  look([6, 34, 58 + rows * 3], [1, 5, 2 + rows * 1.5], 34);
}
const SHOTS = {
  nid: async () => { cyclo(); place(nid(), 0, 0, 0, 0.22); look([9, 8.5, 30], [0, 2.3, 0], 25); },
  'nid-back': async () => { cyclo(C.brume); place(nid({ led: false }), 0, 0, 0, Math.PI - 0.5); look([-8, 12, 28], [0, 2.2, 0], 24); },
  pastille: async () => { cyclo(); place(pastille({ finish: finishFromQ() }), 0, 0, 0, 0.3); look([5, 9, 15], [0, 0.6, 0], 27); },
  pack: async () => {
    cyclo(); const f = finishFromQ();
    [[-3.6, -2.4, -0.3], [3.4, -3.2, 0.1], [-3.0, 3.4, 0.25], [4.0, 3.0, -0.15]].forEach(([x, z, r]) => place(pastille({ finish: f }), x, 0, z, r));
    look([8, 22, 25], [0.4, 0, 0.2], 28);
  },
  cle: async () => { cyclo(); place(cle({ finish: Q.get('finish') === 'encre' ? C.encre : C.coquille }), 0, 0, 0.8, 0.5); look([5, 13, 12], [0, 0.4, -0.6], 30); },
  plus: async () => {
    cyclo(C.brume);
    const p = await phone(); place(p, 1.5, 0, 2, -0.42);
    place(nid(), -9, 0, -8, -0.2);
    look([6, 30, 22], [-1, 0, -0.5], 32);
  },
  'kit-decouverte': () => kitShot('Kit Découverte', '1 Nid · 4 Pastilles · 1 Clé', { nids: 1, pastilles: 4, cles: 1 }),
  'kit-famille': () => kitShot('Kit Famille', '1 Nid · 10 Pastilles · 2 Clés', { nids: 1, pastilles: 10, cles: 2 }),
  'kit-maison': () => kitShot('Kit Maison', '2 Nids · 16 Pastilles · 3 Clés', { nids: 2, pastilles: 16, cles: 3 }),

  /* Cuisine : placard sous l’évier, Pastille posée, cubes d’éveil au sol */
  cuisine: async () => {
    scene.environment = studioEnv(C.brume);
    key.position.set(-80, 60, 40); key.intensity = 2.1;
    const floor = new T.Mesh(new T.PlaneGeometry(600, 600), M.matte(0xEDEBE6, 0.9)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const wall = new T.Mesh(new T.PlaneGeometry(600, 300), M.matte(C.brume, 0.95)); wall.position.set(0, 150, -62); wall.receiveShadow = true; scene.add(wall);
    const doorM = new T.MeshPhysicalMaterial({ color: lin(C.coquille), roughness: 0.32, clearcoat: 0.5, clearcoatRoughness: 0.25 });
    const carcass = new T.Mesh(new T.BoxGeometry(242, 76, 58), M.matte(0xE9E7E2, 0.7)); carcass.position.set(0, 48, -32); carcass.castShadow = carcass.receiveShadow = true; scene.add(carcass);
